name: FSCA CIS Scraper Schedule

on:
  schedule:
    - cron: '0 1 * * *' # Run daily at 01:00 AM UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape-and-transform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dbt-sqlite

      - name: Ensure Data Directory Exists
        run: mkdir -p data

      - name: Run CIS Scraper
        env:
          PYTHONPATH: src
        run: python -m fsca_scraper scrape

      - name: Run dbt Transformations
        run: |
          dbt run --project-dir dbt_fsca --profiles-dir dbt_fsca

      - name: Upload Database Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fsca-cis-database
          path: data/fsca_cis.db

      - name: Commit and Push Database Changes (Optional)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fsca_cis.db
          # Commit only if there are changes to the DB file
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update scraper database [skip ci]"
          git push || echo "Git push skipped or failed"
